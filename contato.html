<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#121212">
    <title>Contato | Patrick Gonçalves Pinheiro</title>
    <meta name="author" content="Patrick Gonçalves Pinheiro">
    <meta name="description"
        content="Entre em contato com Patrick Gonçalves Pinheiro para oportunidades e colaborações.">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231d44b8'/%3E%3Ctext x='50' y='68' font-size='56' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
    <script>
        /* Aplica o tema salvo antes da pintura da tela (evita piscar). Padrão: escuro. */
        try {
            var t = localStorage.getItem('tema');
            if (t === 'claro' || t === 'escuro') {
                document.documentElement.dataset.tema = t;
            } else if (matchMedia('(prefers-color-scheme: light)').matches) {
                document.documentElement.dataset.tema = 'claro';
            }
        } catch (e) { }
    </script>
    <link rel="stylesheet" href="css/style.css?v=2">
    <script src="js/script.js?v=2" defer></script>
</head>

<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <main class="container" id="conteudo">
        <button class="tema-btn" id="botao-tema" type="button" aria-pressed="false">Tema claro</button>

        <header class="perfil">
            <!-- width/height reservam o espaço (evita CLS); fetchpriority acelera o LCP -->
            <img class="perfil__foto" src="img/eu.jpg" width="120" height="120" fetchpriority="high"
                decoding="async" alt="Foto de Patrick Gonçalves Pinheiro">
            <div class="perfil__texto">
                <h1>Patrick Gonçalves Pinheiro</h1>
                <p>Desenvolvedor Front-End</p>
            </div>
        </header>

        <section class="contact-form-section" aria-labelledby="titulo-contato">
            <h2 id="titulo-contato">Entre em contato</h2>
            <p class="contact-intro">Tem alguma pergunta ou proposta? Preencha o formulário abaixo.</p>

            <!--
                ATENÇÃO: troque SEU_ID_AQUI pelo ID do seu formulário em https://formspree.io
                (gratuito). Sem isso o envio não funciona.
                "novalidate" desliga os balões padrão do navegador: quem valida agora é o script.js,
                com mensagens em português e acessíveis a leitores de tela.
            -->
            <form id="form-contato" action="https://formspree.io/f/SEU_ID_AQUI" method="POST" novalidate>
                <div class="form-group">
                    <label for="name">Seu nome</label>
                    <input type="text" id="name" name="name" autocomplete="name" required
                        aria-describedby="name-erro">
                    <p class="erro" id="name-erro"></p>
                </div>
                <div class="form-group">
                    <label for="email">Seu e-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" required
                        aria-describedby="email-erro">
                    <p class="erro" id="email-erro"></p>
                </div>
                <div class="form-group">
                    <label for="message">Sua mensagem</label>
                    <textarea id="message" name="message" rows="5" minlength="10" required
                        aria-describedby="message-erro"></textarea>
                    <p class="erro" id="message-erro"></p>
                </div>
                <button type="submit" class="btn">Enviar mensagem</button>
                <!-- role="status": leitores de tela anunciam o resultado do envio -->
                <p class="form-status" id="form-status" role="status"></p>
            </form>
        </section>

        <footer class="rodape">
            <a href="index.html" class="nav-link">Voltar para links</a>
            <p>&copy; 2026 | Desenvolvido por Patrick Gonçalves Pinheiro</p>
        </footer>

    </main>
</body>

</html>
